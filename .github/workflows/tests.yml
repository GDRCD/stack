name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  macos-bash-3:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify system Bash and run portability checks
        run: |
          /bin/bash --version
          /bin/bash tests/portability.sh
